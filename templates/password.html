<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Enter Password - Habit Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e3e9ed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>

<body>

    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-secondary" id="back-button">←</button>
            <h5 class="mb-0 text-center flex-grow-1" id="welcomeText"></h5>
            <div style="width: 38px;"></div>
        </div>
        <form id="passwordForm" class="d-flex flex-column gap-3">
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
            <button type="submit" class="btn btn-primary" id="button">Continue</button>
            <div id="message" class="text-center small mt-2"></div>
        </form>
    </div>
    

</body>

</html>

<script src="/static/script_password.js"></script>
