<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Select User - Habit Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #e3e9ed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
    }

    .user-button {
      text-transform: capitalize;
    }
  </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-light">
  <h1 class="mb-4 text-center">Welcome to Habit Tracker</h1>

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h5 class="mb-3 text-center">Select your user</h5>
    <div id="userList" class="d-grid gap-2 mb-4">
      <!-- Buttons for each user will go here -->
    </div>

    <form id="newUserForm" class="d-flex flex-column gap-2">
      <input id="newUserInput" type="text" class="form-control" placeholder="Enter new user name">
      <button type="submit" class="btn btn-primary">Create</button>
      <div id="message" class="mt-2 text-center small"></div> <!-- Add this line -->
    </form>

  </div>
</body>

</html>


<script src="/static/script_users.js"></script>
